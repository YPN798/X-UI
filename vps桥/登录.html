<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 桥控制台</title>
<style>
:root{
  --bg:#0b1016; --card:#121922; --line:#243041; --text:#e7eef6; --muted:#8b9bb0;
  --acc:#3d9cf0; --bad:#f85149; --ok:#3fb950;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--text);
  font:15px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 420px at 12% -10%, rgba(61,156,240,.16), transparent 55%),
    radial-gradient(700px 360px at 110% 10%, rgba(63,185,80,.08), transparent 50%),
    var(--bg);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.box{
  width:min(420px,100%); background:var(--card);
  border:1px solid var(--line); border-radius:16px; padding:28px 28px 24px;
  box-shadow:0 24px 80px rgba(0,0,0,.35);
}
.brand{display:flex; align-items:center; gap:12px; margin-bottom:18px}
.mark{
  width:36px; height:36px; border-radius:10px; background:#16324d;
  color:var(--acc); display:grid; place-items:center; font-weight:700; letter-spacing:.04em;
}
h1{margin:0; font-size:18px; font-weight:650}
.sub{margin:4px 0 0; color:var(--muted); font-size:13px}
label{display:block; margin:18px 0 8px; color:var(--muted); font-size:12px; letter-spacing:.04em}
input{
  width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
  background:#0d141c; color:var(--text); font:15px inherit; outline:none;
}
input:focus{border-color:var(--acc); box-shadow:0 0 0 3px rgba(61,156,240,.18)}
button{
  margin-top:16px; width:100%; border:0; border-radius:10px; padding:11px;
  background:var(--acc); color:#061018; font:650 14px inherit; cursor:pointer;
}
button:hover{filter:brightness(1.06)}
.xui{
  display:none; margin-top:10px; text-align:center; text-decoration:none;
  border-radius:10px; padding:10px; border:1px solid var(--line); color:var(--text);
}
.err{min-height:1.3em; margin-top:10px; color:var(--bad); font-size:13px}
.hint{margin:16px 0 0; color:var(--muted); font-size:12px; line-height:1.55}
code{font-family:ui-monospace,Consolas,monospace; color:#c6d4e4}
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <div class="mark">桥</div>
    <div>
      <h1>桥控制台</h1>
      <p class="sub">本机代理池 · 机器 API 同一套鉴权</p>
    </div>
  </div>
  <form id="登">
    <label>管理密码</label>
    <input name="pass" type="password" autocomplete="current-password" autofocus placeholder="web_pass">
    <button type="submit">进入控制台</button>
    <a class="xui" id="去面板" target="_blank" rel="noopener">打开 X-UI 面板</a>
    <div class="err" id="错"></div>
  </form>
  <p class="hint">服务器调用同一密码：请求头 <code>Authorization: Bearer …</code> 或 <code>X-Pass</code>。</p>
</div>
<script>
fetch("/api/panel").then(r=>r.json()).then(j=>{
  if(j&&j.url){ const a=document.getElementById("去面板"); a.href=j.url; a.style.display="block"; }
}).catch(()=>{});
document.getElementById("登").onsubmit=async e=>{
  e.preventDefault();
  const 密=e.target.pass.value;
  const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({pass:密})});
  const j=await r.json().catch(()=>({}));
  if(r.ok && j.ok){ location.href="/"; return; }
  document.getElementById("错").textContent=j.err||"密码不对";
};
</script>
</body>
</html>
